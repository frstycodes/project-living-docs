<!-- project-doc icon sprite — LOCKED. Inlined once, immediately after the
     daily-brief sprite, which owns the source-brand icons (#i-slack, #i-gmail,
     #i-cal, #i-github, #i-drive, #i-spark). These are the structural icons this
     document adds. Every marker in the document comes from one of those two
     sprites — never a unicode glyph, which ignores stroke weight and breaks the
     set's alignment.

     Two flavours, distinguished by the class on the <svg>, not by the symbol:
       .ic.ic-b  brand symbols from the daily-brief sprite — they carry their own fills
       .ic.ic-s  the structural symbols below — stroke is currentColor, weight and
                 caps come from doc-components.css
     Everything here is drawn on a 16×16 grid so the two sets align optically. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- markers and motion -->
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8L6 12.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></symbol>
  <symbol id="i-pivot" viewBox="0 0 16 16"><path d="M10.5 4.5H6a3 3 0 000 6h4.5M9 8.5l2 2-2 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-dot" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/></symbol>

  <!-- citation kinds that have no brand mark -->
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.7 9.3a2.6 2.6 0 004 .3l2-2a2.6 2.6 0 00-3.7-3.7l-1.1 1.1M9.3 6.7a2.6 2.6 0 00-4-.3l-2 2a2.6 2.6 0 003.7 3.7l1.1-1.1"/></symbol>
  <symbol id="i-doc" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3M6 8.5h4M6 11h4"/></symbol>
  <symbol id="i-bead" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="1.6"/></symbol>
  <symbol id="i-commit" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.8"/><path d="M1.5 8h3.7M10.8 8h3.7"/></symbol>
  <symbol id="i-thread" viewBox="0 0 16 16"><path d="M13.5 9.2A1.8 1.8 0 0111.7 11H6l-3 2.3V4.3c0-1 .8-1.8 1.8-1.8h6.9c1 0 1.8.8 1.8 1.8z"/></symbol>

  <!-- state and status -->
  <symbol id="i-block" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M4.1 11.9l7.8-7.8"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.6l5.6 10H2.4zM8 6.6v3M8 11.4v.1"/></symbol>
  <symbol id="i-flight" viewBox="0 0 16 16"><path d="M3 13l10-10M13 3v6M13 3H7"/></symbol>
  <symbol id="i-ship" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M5.4 8.2l1.9 1.9L10.7 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3"/><path d="M10.2 10.2L14 14"/></symbol>

  <!-- an open question, and the marks the citation preview card needs -->
  <symbol id="i-ask" viewBox="0 0 16 16"><path d="M5.8 5.9a2.2 2.2 0 114.2 1c0 1.5-2 1.7-2 3.1M8 13v.1"/></symbol>
  <symbol id="i-merge" viewBox="0 0 16 16"><circle cx="4.4" cy="3.7" r="1.7"/><circle cx="4.4" cy="12.3" r="1.7"/><circle cx="11.6" cy="8" r="1.7"/><path d="M4.4 5.4v5.2M6.1 3.7c0 2.4 1.6 4.3 3.8 4.3"/></symbol>
  <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></symbol>
  <symbol id="i-hash" viewBox="0 0 16 16"><path d="M6.2 2.5L4.6 13.5M11.4 2.5L9.8 13.5M2.8 5.8h11M2.2 10.2h11"/></symbol>

  <!-- tab marks, one per panel, used by the dial -->
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.1"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.2 1.2M11.8 11.8L13 13M13 3l-1.2 1.2M4.2 11.8L3 13"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 16 16"><path d="M1.5 8.5h2.8L6 4l2.6 8L10.4 8.5h4.1"/></symbol>
  <symbol id="i-compass" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M10.6 5.4L9.3 9.3 5.4 10.6 6.7 6.7z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 16 16"><path d="M8 1.8L14.2 5 8 8.2 1.8 5zM1.8 8.3L8 11.5l6.2-3.2M1.8 11.3L8 14.5l6.2-3.2"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></symbol>
  <symbol id="i-fork" viewBox="0 0 16 16"><circle cx="4.2" cy="3.6" r="1.7"/><circle cx="11.8" cy="12.4" r="1.7"/><circle cx="4.2" cy="12.4" r="1.7"/><path d="M4.2 5.3v5.4M5.9 3.6h2.3c1.9 0 1.9 1.6 1.9 3.2v3.9"/></symbol>
  <symbol id="i-user" viewBox="0 0 16 16"><circle cx="8" cy="5.4" r="2.7"/><path d="M2.9 14c0-2.8 2.3-4.4 5.1-4.4s5.1 1.6 5.1 4.4"/></symbol>

  <!-- {GOOGLE FILE TYPES + MEET} — brand marks, so they carry their own fills and
       ride an `.ic.ic-b` svg, exactly like the brief's #i-drive / #i-cal / #i-slack.
       They live here rather than in the brief's sprite because they are the
       project-doc citation card's marks, not the brief's source marks.

       A Drive card has to say *what kind of file* at a glance — in Drive itself
       Docs, Sheets, Slides and PDF are four different colours, and collapsing
       them to one grey page throws away the fastest signal on the card. Each
       sheet is drawn as its product's fill with a white fold and white rules,
       which is the shape Drive uses at small sizes.

       Contrast against --card #1D1D1D, AA graphical (3:1) — these are graphical
       objects, never text: Docs #4285F4 4.73:1, Sheets #0F9D58 4.80:1,
       Slides #F4B400 9.13:1, PDF #EA4335 4.30:1. Meet's lobes: #00AC47 5.61:1,
       #2684FC 4.65:1, #E94235 4.25:1, #FFBA00 9.85:1, #00832D 3.44:1,
       #0066DA 3.14:1. Every one clears 3:1. No word on either card is ever
       painted in these — see the {GOOGLE BRAND} note in doc-components.css. -->
  <symbol id="i-gdoc" viewBox="0 0 16 16"><path fill="#4285F4" d="M3.4 1.3h5.4L12.9 5.4v9.3H3.4z"/><path fill="#FFFFFF" fill-opacity=".5" d="M8.8 1.3l4.1 4.1H8.8z"/><path fill="#FFFFFF" d="M5.3 7.7h5.4v.95H5.3zm0 2.1h5.4v.95H5.3zm0 2.1h3.6v.95H5.3z"/></symbol>
  <symbol id="i-gsheet" viewBox="0 0 16 16"><path fill="#0F9D58" d="M3.4 1.3h5.4L12.9 5.4v9.3H3.4z"/><path fill="#FFFFFF" fill-opacity=".5" d="M8.8 1.3l4.1 4.1H8.8z"/><path fill="#FFFFFF" d="M5.2 7.6h5.6v5.1H5.2zm.95.95v1.1h1.75v-1.1zm2.7 0v1.1h1.9v-1.1zm-2.7 2.05v1.15h1.75v-1.15zm2.7 0v1.15h1.9v-1.15z"/></symbol>
  <symbol id="i-gslide" viewBox="0 0 16 16"><path fill="#F4B400" d="M3.4 1.3h5.4L12.9 5.4v9.3H3.4z"/><path fill="#FFFFFF" fill-opacity=".5" d="M8.8 1.3l4.1 4.1H8.8z"/><path fill="#FFFFFF" d="M5.2 7.9h5.6v4.3H5.2zm.95.95v2.4h3.7v-2.4z"/></symbol>
  <symbol id="i-gpdf" viewBox="0 0 16 16"><path fill="#EA4335" d="M3.4 1.3h5.4L12.9 5.4v9.3H3.4z"/><path fill="#FFFFFF" fill-opacity=".5" d="M8.8 1.3l4.1 4.1H8.8z"/><path fill="#FFFFFF" d="M4.9 8.6h6.2v3.1H4.9z" fill-opacity=".92"/><path fill="#EA4335" d="M5.7 9.3h.85q.6 0 .6.6t-.6.6H5.7zm2.05 0h.75q.75 0 .75.85t-.75.85h-.75zm2.15 0h1.15v.5h-.65v.35h.6v.5h-.6v.55h-.5z"/></symbol>
  <symbol id="i-meet" viewBox="0 0 87.5 72"><path fill="#00832D" d="M49.5 36l8.53 9.75 11.47 7.33 2-17.02-2-16.64-11.69 6.44z"/><path fill="#0066DA" d="M0 51.5V66c0 3.315 2.685 6 6 6h14.5l3-10.96-3-9.54-9.95-3z"/><path fill="#E94235" d="M20.5 0L0 20.5l10.55 3 9.95-3 2.95-9.41z"/><path fill="#2684FC" d="M0 20.5h20.5v31H0z"/><path fill="#00AC47" d="M82.6 8.68L69.5 19.42v33.66l13.16 10.79c1.97 1.54 4.85.135 4.85-2.37V11c0-2.535-2.945-3.925-4.91-2.32zM49.5 36v15.5H20.5V72h43c3.315 0 6-2.685 6-6V53.08z"/><path fill="#FFBA00" d="M63.5 0h-43v20.5h29V36l20-16.57V6c0-3.315-2.685-6-6-6z"/></symbol>
</svg>
